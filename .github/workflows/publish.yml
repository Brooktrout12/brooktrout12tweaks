name: Publish tweaks (phone setup)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Import the uploaded ZIP once
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import hashlib, zipfile
          marker = Path('.phone-setup-complete')
          if not marker.exists():
              archive = Path('Brooktrout12Tweaks_Upload_Ready.zip')
              expected = '71c4f4b5226d4c8f399d4aa17d5d60c26b0865251d69269dd514ed756efeef71'
              if not archive.is_file():
                  raise SystemExit('Upload Brooktrout12Tweaks_Upload_Ready.zip to the repository root first.')
              if hashlib.sha256(archive.read_bytes()).hexdigest() != expected:
                  raise SystemExit('ZIP differs from the supplied bundle. Upload the original ZIP unchanged.')
              with zipfile.ZipFile(archive) as z:
                  for info in z.infolist():
                      p = PurePosixPath(info.filename)
                      if not p.parts or p.parts[0] != 'Brooktrout12Tweaks':
                          continue
                      rel = PurePosixPath(*p.parts[1:])
                      if not rel.parts or rel.parts[0] == '.github':
                          continue
                      if '..' in rel.parts or '.git' in rel.parts or rel.is_absolute():
                          raise SystemExit('Unsafe archive path')
                      if info.is_dir():
                          continue
                      target = Path(*rel.parts)
                      target.parent.mkdir(parents=True, exist_ok=True)
                      target.write_bytes(z.read(info))
                      if target.suffix == '.sh':
                          target.chmod(0o755)
              marker.write_text(expected + '\n')
          PY
      - name: Build and verify package repository
        run: |
          python3 scripts/build_repo.py
          python3 scripts/verify_repo.py
      - name: Publish extracted sources to GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add debs sources scripts provenance catalog.json README.md SETUP.md LICENSE LICENSING.md .gitattributes .gitignore .phone-setup-complete
          if ! git diff --cached --quiet; then
            git commit -m "Import tweak packages and open-source projects"
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
